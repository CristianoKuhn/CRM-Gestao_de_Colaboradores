<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Fundo com cantos arredondados -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- Brilho superior -->
  <rect width="180" height="90" rx="40" fill="url(#shine)"/>
  <!-- Círculo decorativo de fundo -->
  <circle cx="130" cy="50" r="32" fill="#ffffff" fill-opacity="0.08"/>
  <!-- Texto G -->
  <text x="47" y="112" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="76" fill="#ffffff" letter-spacing="-1">G</text>
  <!-- Texto 360 menor -->
  <text x="94" y="137" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="40" fill="#5EEAD4" letter-spacing="0">360</text>
  <!-- Linha decorativa -->
  <rect x="32" y="144" width="115" height="5" rx="3" fill="#5EEAD4" fill-opacity="0.6"/>
</svg>
