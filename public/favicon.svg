<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Fundo com cantos arredondados -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Brilho superior -->
  <rect width="32" height="16" rx="7" fill="url(#shine)"/>
  <!-- Círculo decorativo de fundo -->
  <circle cx="23" cy="9" r="6" fill="#ffffff" fill-opacity="0.08"/>
  <!-- Texto G -->
  <text x="8" y="20" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="-1">G</text>
  <!-- Texto 360 menor -->
  <text x="17" y="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="7" fill="#5EEAD4" letter-spacing="0">360</text>
  <!-- Linha decorativa -->
  <rect x="6" y="26" width="20" height="1" rx="0" fill="#5EEAD4" fill-opacity="0.6"/>
</svg>
