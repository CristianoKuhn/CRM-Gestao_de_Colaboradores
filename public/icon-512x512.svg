<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="113" fill="url(#bg)"/>
  <!-- Brilho superior -->
  <rect width="512" height="256" rx="113" fill="url(#shine)"/>
  <!-- Círculo decorativo de fundo -->
  <circle cx="369" cy="143" r="92" fill="#ffffff" fill-opacity="0.08"/>
  <!-- Texto G -->
  <text x="133" y="317" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="215" fill="#ffffff" letter-spacing="-1">G</text>
  <!-- Texto 360 menor -->
  <text x="266" y="389" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="113" fill="#5EEAD4" letter-spacing="0">360</text>
  <!-- Linha decorativa -->
  <rect x="92" y="410" width="328" height="15" rx="8" fill="#5EEAD4" fill-opacity="0.6"/>
</svg>
